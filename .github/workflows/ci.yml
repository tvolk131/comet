name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      blossom: ${{ steps.filter.outputs.blossom }}
      docs_deploy: ${{ steps.filter.outputs.docs_deploy }}
      relay: ${{ steps.filter.outputs.relay }}
      www_deploy: ${{ steps.filter.outputs.www_deploy }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - '.cargo/**'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
              - 'package.json'
            blossom:
              - 'blossom/**'
              - 'packages/nostr/**'
              - 'packages/data/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            docs_deploy:
              - 'docs/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            relay:
              - 'relay/**'
              - 'packages/nostr/**'
              - 'packages/data/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            www_deploy:
              - 'www/**'

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, and build affected packages
        run: pnpm turbo run lint typecheck build --affected --filter='!@comet/app'

  test:
    if: needs.changes.outputs.app == 'true'
    needs: changes
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./app/native -> target

      - name: Run Rust tests
        run: cargo test --locked --manifest-path app/native/Cargo.toml

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path app/native/Cargo.toml

      - name: Build native desktop
        run: cargo build --locked --manifest-path app/native/Cargo.toml

      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-differences
          path: app/native/target/screenshot-failures/
          if-no-files-found: ignore

  test-wgpu:
    name: Visual tests (wgpu / Vulkan software adapter)
    if: needs.changes.outputs.app == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    env:
      ICED_TEST_BACKEND: wgpu
      WGPU_BACKEND: vulkan
      # Exercise iced's GPU pipeline on ordinary hosted runners. This is not a
      # hardware GPU benchmark or a substitute for local Metal coverage.
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      XDG_RUNTIME_DIR: /tmp/comet-runtime
    steps:
      - uses: actions/checkout@v6

      - name: Install native and Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libdbus-1-dev libssl-dev pkg-config libfontconfig1-dev mesa-vulkan-drivers vulkan-tools
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          vulkaninfo --summary

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./app/native -> target

      - name: Compare GPU pipeline to reviewed CPU screenshots
        run: cargo test --locked --manifest-path app/native/Cargo.toml --test screenshots --test editor_interactions -- --test-threads=1

      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-differences-wgpu
          path: app/native/target/screenshot-failures/
          if-no-files-found: ignore

  relay:
    if: needs.changes.outputs.relay == 'true'
    needs: changes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: comet_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/comet_test
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build relay
        run: pnpm relay:build

      - name: Run relay tests
        run: pnpm relay:test

  blossom:
    if: needs.changes.outputs.blossom == 'true'
    needs: changes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: comet_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/comet_test
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build blossom
        run: pnpm blossom:build

      - name: Run blossom tests
        run: pnpm blossom:test

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.app == 'true'
    needs: [changes, format, checks, test, test-wgpu]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-26
            args: --target aarch64-apple-darwin
            arch: aarch64
          - platform: macos-26
            args: --target x86_64-apple-darwin
            arch: x86_64
          - platform: ubuntu-22.04
            args: ""
            arch: x86_64-linux

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libdbus-1-dev libssl-dev pkg-config libfontconfig1-dev patchelf libfuse2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./app/native -> target

      - name: Build native desktop
        run: cargo build --locked --release --manifest-path app/native/Cargo.toml ${{ matrix.args }}

      - name: Install native packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Package macOS application
        if: startsWith(matrix.platform, 'macos')
        run: python3 app/scripts/package-native.py --target ${{ matrix.arch }}-apple-darwin --formats app,dmg
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package Linux application
        if: matrix.platform == 'ubuntu-22.04'
        run: python3 app/scripts/package-native.py --formats deb,appimage

      - name: Upload native installers
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.arch }}
          path: |
            app/native/target/packages/*.dmg
            app/native/target/packages/*.deb
            app/native/target/packages/*.AppImage

  release:
    if: github.event_name == 'push' && needs.changes.outputs.app == 'true'
    needs: [changes, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: native-*
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f 2>/dev/null || echo "No artifacts found"

      - name: Generate short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: sh .github/scripts/generate-release-notes.sh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha-${{ steps.sha.outputs.short }}
          name: alpha-${{ steps.sha.outputs.short }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
          make_latest: true

  www_preview:
    if: github.event_name == 'pull_request' && needs.changes.outputs.www_deploy == 'true'
    needs: [changes, format]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @comet/www

      - name: Build and deploy preview
        id: deploy
        run: |
          OUTPUT=$(pnpm --filter @comet/www run deploy:preview 2>&1)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oP 'https://[^\s]+\.pages\.dev' | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL
        if: steps.deploy.outputs.url
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: www-preview
          message: |
            **www preview:** ${{ steps.deploy.outputs.url }}

  www_deploy:
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      needs.format.result == 'success' &&
      (needs.changes.outputs.www_deploy == 'true' || needs.release.result == 'success')
    needs: [changes, format, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @comet/www

      - name: Build and deploy www
        run: pnpm --filter @comet/www run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  docs_preview:
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs_deploy == 'true'
    needs: [changes, format]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @comet/docs

      - name: Build and deploy preview
        id: deploy
        run: |
          OUTPUT=$(pnpm --filter @comet/docs run deploy:preview 2>&1)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oP 'https://[^\s]+\.pages\.dev' | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL
        if: steps.deploy.outputs.url
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: docs-preview
          message: |
            **docs preview:** ${{ steps.deploy.outputs.url }}

  docs_deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.docs_deploy == 'true'
    needs: [changes, format, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @comet/docs

      - name: Build and deploy docs
        run: pnpm --filter @comet/docs run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
