[package]
name = "comet"
version = "0.1.0"
description = "Comet native Markdown notes"
authors = ["you"]
edition = "2021"
default-run = "comet"

[lib]
name = "comet_lib"

[dependencies]
# Prefer the GPU renderer in the desktop app; retain tiny-skia for tests and fallback.
# Keep translucent surfaces consistent with the software renderer's sRGB blending.
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "web-colors", "tokio", "advanced", "image", "svg", "x11", "wayland"] }
iced-m3 = { version = "=0.1.0-beta.1", default-features = false }
dirs = "6"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rfd = "0.17"
open = "5"
env_logger = "0.11"
pulldown-cmark = { version = "0.12.2", default-features = false }
unicode-segmentation = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7.4"
tokio = { version = "1.50.0", features = [
  "fs",
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
nostr-sdk = { version = "0.44.1", features = ["nip59"] }
notify = "8.2.0"
walkdir = "2.5.0"
gray_matter = "0.3.2"
html-escape = "0.2"
rusqlite_migration = "2.4.1"
rusqlite = { version = "0.38.0", features = ["bundled"] }
sha2 = "0.10"
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
futures-util = "0.3.32"
log = "0.4.29"
reqwest = { version = "0.13.2", features = ["native-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
base64 = "0.22.1"
regex-lite = "0.1.9"
chacha20 = "0.9"
chacha20poly1305 = "0.10.1"
subtle = "2"
getrandom = "0.3"
hex = "0.4.3"
hmac = "0.12.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }

[dev-dependencies]
iced_test = "=0.14.0"
# The rendering benchmark uses each backend's presentation API directly.
iced_tiny_skia = { version = "=0.14.1", default-features = false }
iced_wgpu = { version = "=0.14.0", default-features = false }
tiny-skia = "=0.11.4"
png = "=0.18.1"
tempfile = "3"
postgres = "0.19"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

# Pin the upstream mixed-font ASCII fix while iced-m3 requires iced 0.14.
[patch.crates-io]
cosmic-text = { git = "https://github.com/pop-os/cosmic-text.git", rev = "8cd21a315a7eee77fdbfb00e516fb1fe2bfbd4ab" }
